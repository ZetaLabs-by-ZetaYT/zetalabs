:root{
  --bg:#080816;
  --surface:rgba(255,255,255,.04);
  --text:#f5f2ff;
  --muted:#b9b1d6;
  --line:rgba(255,255,255,.10);
  --violet:#8b5cf6;
  --blue:#3b82f6;
  --safe-area-inset-top:0px;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#080816;
    --text:#f5f2ff;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Manrope',system-ui,-apple-system,sans-serif
}

h1,h2,h3,.display{
  font-family:'Sora',system-ui,sans-serif
}

a{
  color:inherit
}

::-moz-selection{
  background:#d946ef;
  color:white
}

::selection{
  background:#d946ef;
  color:white
}

.card-hover{
  transition:transform .25s ease,border-color .25s ease,background .25s ease
}

.card-hover:hover{
  transform:translateY(-3px);
  border-color:rgba(167,139,250,.35);
  background:#151522
}

.btn-primary{
  transition:transform .3s ease,filter .3s ease,box-shadow .3s ease
}

.btn-primary:hover{
  transform:scale(1.03) translateY(-1px);
  filter:brightness(1.08);
  box-shadow:0 12px 32px rgba(139,92,246,.35),0 0 0 1px rgba(167,139,250,.25)
}

.btn-primary:active{
  transform:scale(.98)
}

a.btn-primary:hover{
  box-shadow:0 12px 32px rgba(139,92,246,.35),0 0 0 1px rgba(167,139,250,.25)
}

.footer-discord-btn{
  box-shadow:0 14px 35px rgba(88,101,242,.45),0 4px 12px rgba(88,101,242,.25),0 0 0 1px rgba(255,255,255,.18);
  transition:transform .3s ease,filter .3s ease,box-shadow .3s ease
}

.footer-discord-btn:hover{
  transform:translateY(-3px);
  filter:brightness(1.12);
  box-shadow:0 20px 44px rgba(88,101,242,.58),0 6px 16px rgba(139,92,246,.35),0 0 0 1px rgba(255,255,255,.28)
}

.footer-discord-btn:active{
  transform:translateY(-1px)
}

:focus-visible{
  outline:2px solid #a78bfa;
  outline-offset:3px;
  border-radius:6px
}

/* Colourful creator touches */

.logo-sticker{
  background:linear-gradient(135deg,#a855f7 0%,#6366f1 35%,#06b6d4 70%,#ec4899 100%);
  border:3px solid rgba(255,255,255,.9);
  border-radius:18px;
  box-shadow:0 8px 28px rgba(168,85,247,.55),0 2px 0 rgba(255,255,255,.25) inset;
  transform:rotate(-3deg);
  text-shadow:0 2px 8px rgba(0,0,0,.35);
}

.signature-hand{
  font-family:'Caveat','Segoe Script','Bradley Hand',cursive;
}

.signature-gradient{
  background:linear-gradient(90deg,#c4b5fd,#e879f9,#f472b6);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.rainbow-text{
  background:linear-gradient(90deg,#a78bfa,#60a5fa,#22d3ee,#f472b6,#a78bfa);
  background-size:220% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:rainbow-slide 9s linear infinite;
}

@keyframes rainbow-slide{
  to{
    background-position:220% 0
  }
}

.service-card{
  transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease
}

.service-card:hover{
  transform:translateY(-6px);
  box-shadow:0 22px 44px rgba(0,0,0,.38),0 0 32px rgba(139,92,246,.22);
  border-color:rgba(167,139,250,.55)
}

.service-card .service-icon{
  transition:transform .3s ease
}

.service-card:hover .service-icon{
  transform:scale(1.1) rotate(-4deg)
}

.assistance-card{
  background:linear-gradient(135deg,rgba(139,92,246,.22),rgba(59,130,246,.16) 45%,rgba(34,211,238,.18) 80%,rgba(244,114,182,.16));
  box-shadow:0 18px 45px rgba(139,92,246,.18);
}

.blob{
  animation:blob-float 11s ease-in-out infinite
}

.blob-delay{
  animation-delay:-5.5s
}

@keyframes blob-float{
  0%,100%{
    transform:translateY(0) scale(1);
    opacity:.9
  }

  50%{
    transform:translateY(-14px) scale(1.06);
    opacity:1
  }
}

.float-slow{
  animation:float-y 5s ease-in-out infinite
}

.float-delay{
  animation-delay:-2.5s
}

@keyframes float-y{
  0%,100%{
    transform:translateY(0) rotate(-4deg)
  }

  50%{
    transform:translateY(-10px) rotate(4deg)
  }
}

/* Scroll reveal — soft fade-up, driven by IntersectionObserver in App.tsx */

[data-reveal]{
  opacity:0;
  transform:translateY(18px);
  transition:opacity .6s ease,transform .6s ease;
  transition-delay:var(--reveal-delay,0ms);
  will-change:opacity,transform
}

[data-reveal].is-visible{
  opacity:1;
  transform:translateY(0)
}

/* Hero entrance — staggered, soft */

.hero-enter{
  opacity:0;
  animation:hero-fade-up .6s ease forwards;
  animation-delay:var(--hero-delay,0ms)
}

.hero-enter-left{
  opacity:0;
  animation:hero-slide-left .6s ease forwards;
  animation-delay:var(--hero-delay,0ms)
}

@keyframes hero-fade-up{
  from{
    opacity:0;
    transform:translateY(14px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

@keyframes hero-slide-left{
  from{
    opacity:0;
    transform:translateX(-18px)
  }

  to{
    opacity:1;
    transform:translateX(0)
  }
}

.hero-logo-float{
  animation:hero-float 5s ease-in-out infinite
}

@keyframes hero-float{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-7px)
  }
}

.signature-reveal{
  opacity:0;
  animation:hero-fade-up .6s ease forwards;
  animation-delay:.55s
}

/* Cuore statico: nessuna animazione, nessun pulse, nessun transform. */

/* ONLINE badge — soft pulsing green dot */

.online-dot{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:9999px;
  background:#4ade80;
  box-shadow:0 0 0 0 rgba(74,222,128,.55);
  animation:online-pulse 2s ease-in-out infinite;
  flex-shrink:0
}

@keyframes online-pulse{
  0%{
    box-shadow:0 0 0 0 rgba(74,222,128,.5)
  }

  70%{
    box-shadow:0 0 0 6px rgba(74,222,128,0)
  }

  100%{
    box-shadow:0 0 0 0 rgba(74,222,128,0)
  }
}

/* Header dropdown */

.dropdown-panel{
  animation:dropdown-in .2s ease-out both;
  transform-origin:top center;
}

.dropdown-accordion{
  animation:dropdown-in .2s ease-out both;
  transform-origin:top center;
}

@keyframes dropdown-in{
  from{
    opacity:0;
    transform:translateY(-6px) scale(.98)
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1)
  }
}

/* FAQ — smooth height / opacity transition (grid-rows technique) */

.faq-answer{
  display:grid;
  grid-template-rows:0fr;
  opacity:0;
  transition:grid-template-rows .45s ease,opacity .35s ease
}

.faq-answer.open{
  grid-template-rows:1fr;
  opacity:1
}

.faq-answer > div{
  overflow:hidden
}

.faq-icon{
  transition:transform .35s ease
}

.faq-icon.open{
  transform:rotate(45deg)
}

@media (prefers-reduced-motion: reduce){
  html{
    scroll-behavior:auto
  }

  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important
  }

  .rainbow-text,.blob,.float-slow,.hero-logo-float,.online-dot{
    animation:none !important
  }

  [data-reveal]{
    opacity:1 !important;
    transform:none !important;
    transition:none
  }

  .hero-enter,.hero-enter-left,.signature-reveal{
    opacity:1 !important;
    animation:none !important
  }

  .dropdown-panel,.dropdown-accordion{
    animation:none
  }

  .faq-answer{
    transition:none
  }
}

.placeholder\:text-white\/35::-moz-placeholder{
  color: rgb(255 255 255 / 0.35);
